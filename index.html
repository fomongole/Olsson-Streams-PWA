<!doctype html>
<html lang="en" style="background: #0e1621">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Olsson Streams</title>
    <meta name="description" content="Movies, series and live streams." />

    <!-- No white flash on launch: HTML background matches the app theme -->
    <meta name="theme-color" content="#0E1621" />
    <meta name="color-scheme" content="dark" />

    <!-- Never attach our origin to a media request: the stream CDN and
         hls.js' XHR both take their referrer policy from the document
         (`referrerpolicy` does not exist on <video> or XMLHttpRequest). -->
    <meta name="referrer" content="no-referrer" />

    <!-- iOS standalone PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Olsson Streams" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
